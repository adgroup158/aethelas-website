    <style>

        .reveal { opacity:0; transform:translateY(50px) scale(0.97); transition:opacity 1s cubic-bezier(0.23,1,0.32,1), transform 1s cubic-bezier(0.23,1,0.32,1); }

    <script>
        // ===== NEURAL CANVAS =====
        (function() {
            const canvas = document.getElementById('neuro-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [], mouse = { x: null, y: null };
            function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            class NeuroParticle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * W; this.y = Math.random() * H;
                    this.vx = (Math.random() - 0.5) * 0.3; this.vy = (Math.random() - 0.5) * 0.3;
                    this.size = Math.random() * 1.8 + 0.4; this.baseSize = this.size;
                    const colors = ['#00d4ff', '#a855f7', '#f472b6', '#2dd4bf', '#fbbf24', '#6366f1', '#3b82f6'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.phase = Math.random() * Math.PI * 2; this.pulseSpeed = 0.3 + Math.random() * 0.4;
                    this.orbitAngle = Math.random() * Math.PI * 2; this.orbitSpeed = (Math.random() - 0.5) * 0.02;
                    this.type = Math.random() > 0.7 ? 'core' : 'normal';
                }
                update() {
                    this.phase += 0.01; this.orbitAngle += this.orbitSpeed;
                    this.x += this.vx + Math.sin(this.phase) * 0.02;
                    this.y += this.vy + Math.cos(this.phase * 0.7) * 0.02;
                    this.x += Math.cos(this.orbitAngle) * 0.04;
                    this.y += Math.sin(this.orbitAngle) * 0.04;
                    if (this.x < -20) this.x = W + 20; if (this.x > W + 20) this.x = -20;
                    if (this.y < -20) this.y = H + 20; if (this.y > H + 20) this.y = -20;
                    this.size = this.baseSize * (1 + 0.3 * Math.sin(this.phase * this.pulseSpeed));
                    if (mouse.x !== null) {
                        const dx = this.x - mouse.x, dy = this.y - mouse.y, dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 200) { const force = (200 - dist) / 200 * 0.08;
                            this.x += dx / dist * force * 0.5; this.y += dy / dist * force * 0.5; }
                    }
                }
                draw() {
                    const alpha = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(this.phase * this.pulseSpeed));
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color; ctx.globalAlpha = alpha * 0.6; ctx.fill();
                    if (this.type === 'core') {
                        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                        grad.addColorStop(0, this.color); grad.addColorStop(1, 'transparent');
                        ctx.globalAlpha = 0.08; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                        ctx.fillStyle = grad; ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }
            }
            const numParticles = Math.min(280, Math.floor(W * H / 5000));
            for (let i = 0; i < numParticles; i++) particles.push(new NeuroParticle());
            document.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
            document.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
            function drawConnections() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const p1 = particles[i], p2 = particles[j], dx = p1.x - p2.x, dy = p1.y - p2.y, dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 160) {
                            ctx.globalAlpha = (1 - dist / 160) * 0.12;
                            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = p1.color; ctx.lineWidth = 0.4; ctx.stroke();
                        }
                    }
                }
                ctx.globalAlpha = 1;
            }
            function animate() {
                ctx.clearRect(0, 0, W, H);
                for (const p of particles) { p.update(); p.draw(); }
                drawConnections();
                const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.8);
                grad.addColorStop(0, 'transparent'); grad.addColorStop(1, 'rgba(2,4,8,0.4)');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
                requestAnimationFrame(animate);
            }
            window.addEventListener('resize', () => { resize(); for (const p of particles) { p.x = Math.random() * W; p.y = Math.random() * H; } });
            animate();
        })();

        // ===== TERMINAL ENGINE =====
        (function() {
            const output = document.getElementById('terminal-output');
            const input = document.getElementById('terminal-input');
            let history = [];
            let historyIndex = -1;

            // --- Command Definitions ---
            const commands = {
                help: {
                    description: 'Show available commands',
                    execute: function() {
                        const cmds = Object.keys(commands).sort();
                        let result = '<span class="output cyan">Available Commands:</span>\n';
                        for (const cmd of cmds) {
                            const desc = commands[cmd].description || 'No description';
                            result += `  <span class="output highlight">${cmd}</span> — ${desc}\n`;
                        }
                        result += '\n<span class="output">Type any command and press Enter.</span>';
                        return result;
                    }
                },
                status: {
                    description: 'Show system status',
                    execute: function() {
                        const timestamp = new Date().toISOString();
                        return `<span class="output success">✅ System Status</span>
                        <span class="output">  chain: aethelas-mainnet-1</span>
                        <span class="output">  consensus: iPoS BFT</span>
                        <span class="output">  block_time: 5s</span>
                        <span class="output">  nodes: 20 active</span>
                        <span class="output">  red_team_attacks: 18/18 blocked</span>
                        <span class="output">  uptime: 72h 14m</span>
                        <span class="output">  timestamp: ${timestamp}</span>`;
                    }
                },
                info: {
                    description: 'Show system information',
                    execute: function() {
                        return `<span class="output cyan">📊 System Information</span>
                        <span class="output">  architecture: 7-16-8-1</span>
                        <span class="output">  weight_count: 273</span>
                        <span class="output">  weights_hash: 73e5d1cb4788beb2</span>
                        <span class="output">  never_stops: true</span>
                        <span class="output">  model_type: continual_neural_network</span>
                        <span class="output">  memory_type: verifiable</span>
                        <span class="output">  unlearning: supported</span>
                        <span class="output">  proof: merkle_root_changed</span>`;
                    }
                },
                memory: {
                    description: 'Show memory status',
                    execute: function() {
                        return `<span class="output neuro">🧠 Memory Status</span>
                        <span class="output">  total_entries: 1,247</span>
                        <span class="output">  verified_entries: 1,203</span>
                        <span class="output">  unverified_entries: 44</span>
                        <span class="output">  retention_rate: 96.5%</span>
                        <span class="output">  last_snapshot: 2026-09-06 14:23:52</span>
                        <span class="output">  memory_root: 0x7f3a9b2c4d5e6f7a8b9c</span>`;
                    }
                },
                prove: {
                    description: 'Prove a record exists (simulated)',
                    execute: function() {
                        const hash = '0x' + Array.from({length:40}, () => Math.floor(Math.random()*16).toString(16)).join('');
                        return `<span class="output success">🔗 Verification Proof</span>
                        <span class="output">  status: ✅ verified</span>
                        <span class="output">  merkle_root: ${hash}</span>
                        <span class="output">  timestamp: ${new Date().toISOString()}</span>
                        <span class="output">  signature: 0x${Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join('')}</span>
                        <span class="output">  proof_type: cryptographic</span>`;
                    }
                },
                unlearn: {
                    description: 'Simulate unlearning a record',
                    execute: function() {
                        const hash = '0x' + Array.from({length:40}, () => Math.floor(Math.random()*16).toString(16)).join('');
                        return `<span class="output error">🗑️ Unlearning Simulation</span>
                        <span class="output">  status: ✅ removed</span>
                        <span class="output">  record_id: 0x${Array.from({length:24}, () => Math.floor(Math.random()*16).toString(16)).join('')}</span>
                        <span class="output">  previous_root: ${hash}</span>
                        <span class="output">  new_root: 0x${Array.from({length:40}, () => Math.floor(Math.random()*16).toString(16)).join('')}</span>
                        <span class="output">  proof: merkle_root_changed</span>
                        <span class="output">  timestamp: ${new Date().toISOString()}</span>`;
                    }
                },
                benchmark: {
                    description: 'Run the benchmark suite',
                    execute: function() {
                        return `<span class="output highlight">📈 Benchmark Results</span>
                        <span class="output">  hallucination_detection: 8/8 (100%)</span>
                        <span class="output">  mathematical_correctness: 5/5 (100%)</span>
                        <span class="output">  value_alignment: 4/4 (100%)</span>
                        <span class="output">  planning_quality: 3/3 (100%)</span>
                        <span class="output">  trust_calibration: 3/3 (100%)</span>
                        <span class="output">  memory_retention: 4/5 (80%)</span>
                        <span class="output">  continual_learning: 7/10 (70%)</span>
                        <span class="output success">  OVERALL: 34/38 (89.5%)</span>`;
                    }
                },
                whoami: {
                    description: 'Show current user',
                    execute: function() {
                        return `<span class="output">👤 Current User: aethelas@neural</span>
                        <span class="output">  role: system_administrator</span>
                        <span class="output">  permissions: full</span>`;
                    }
                },
                date: {
                    description: 'Show current date and time',
                    execute: function() {
                        return `<span class="output">📅 ${new Date().toString()}</span>`;
                    }
                },
                clear: {
                    description: 'Clear the terminal',
                    execute: function() {
                        output.innerHTML = '';
                        return null;
                    }
                },
                echo: {
                    description: 'Echo a message (usage: echo "text")',
                    execute: function(args) {
                        const msg = args.join(' ') || 'Hello, world!';
                        return `<span class="output">${msg}</span>`;
                    }
                },
                about: {
                    description: 'Show about Aethelas',
                    execute: function() {
                        return `<span class="output cyan">⚡ Aethelas — Verifiable AI Memory</span>
                        <span class="output">  A trust layer: verified, auditable,</span>
                        <span class="output">  provably-forgettable memory around any AI.</span>
                        <span class="output">  Built for trust. Designed for the future.</span>`;
                    }
                }
            };

            // --- Helper: Print to terminal ---
            function printLine(text, className = '') {
                if (!text) return;
                const lines = text.split('\n');
                for (const line of lines) {
                    const div = document.createElement('div');
                    div.className = 'line';
                    if (className) {
                        div.innerHTML = `<span class="${className}">${line}</span>`;
                    } else {
                        div.innerHTML = line;
                    }
                    output.appendChild(div);
                }
                output.scrollTop = output.scrollHeight;
            }

            // --- Helper: Print command line ---
            function printCommand(cmd) {
                const div = document.createElement('div');
                div.className = 'line';
                div.innerHTML = `<span class="prompt">$</span> <span class="cmd">${cmd}</span>`;
                output.appendChild(div);
                output.scrollTop = output.scrollHeight;
            }

            // --- Process command ---
            function processCommand(cmd) {
                const trimmed = cmd.trim();
                if (!trimmed) return;

                // Add to history
                history.push(trimmed);
                historyIndex = history.length;

                // Print command
                printCommand(trimmed);

                // Parse command
                const parts = trimmed.split(' ');
                const commandName = parts[0].toLowerCase();
                const args = parts.slice(1);

                // Execute
                if (commands[commandName]) {
                    const result = commands[commandName].execute(args);
                    if (result !== null) {
                        printLine(result);
                    }
                } else {
                    printLine(`<span class="output error">Command not found: ${commandName}. Type 'help' for available commands.</span>`);
                }

                // Add blank line for readability
                const blank = document.createElement('div');
                blank.className = 'line';
                blank.innerHTML = '&nbsp;';
                output.appendChild(blank);
                output.scrollTop = output.scrollHeight;

                // Clear input
                input.value = '';
            }

            // --- Welcome Message ---
            function showWelcome() {
                const welcome = `
<span class="output cyan">⚡ Aethelas Terminal v1.0</span>
<span class="output">Welcome to the Aethelas command interface.</span>
<span class="output">Type <span class="highlight">help</span> for available commands.</span>
`;
                printLine(welcome);
                const blank = document.createElement('div');
                blank.className = 'line';
                blank.innerHTML = '&nbsp;';
                output.appendChild(blank);
                output.scrollTop = output.scrollHeight;
            }

            // --- Event Listeners ---
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const cmd = this.value;
                    processCommand(cmd);
                }

                // Arrow Up: Previous command
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (historyIndex > 0) {
                        historyIndex--;
                        this.value = history[historyIndex] || '';
                    }
                }

                // Arrow Down: Next command
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (historyIndex < history.length - 1) {
                        historyIndex++;
                        this.value = history[historyIndex] || '';
                    } else {
                        historyIndex = history.length;
                        this.value = '';
                    }
                }
            });

            // Focus input on click
            document.querySelector('.terminal-window').addEventListener('click', function() {
                input.focus();
            });

            // --- Start ---
            showWelcome();
            input.focus();
        })();
    </script>
</body>
</html>
